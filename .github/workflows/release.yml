name: Release

# Publishes a PACKED TARBALL as a release asset, which is how Genie installs
# this package.
#
# Not a git spec, and not for want of trying: npm cannot install a git spec
# GLOBALLY when the package has a `prepare` that needs its own dependencies. npm
# prepares a git dep by cloning it and shelling out to a nested `npm install`
# inside the clone, and that nested process inherits `npm_config_global` and
# `npm_config_prefix` from the outer `-g`. The clone's dependencies land in the
# global prefix, the clone itself never gets a `node_modules/.bin`, and `prepare`
# then runs a `tsc` that is not there. That is what made this TUI uninstallable
# (genie#469 has the trace).
#
# npm never runs `prepare` on a tarball, because the build already happened here.
# So the tarball's CONTENTS are the whole contract, and
# `src/__tests__/package-contents.test.ts` is what holds them.

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.13'
                  cache: npm

            - run: npm ci

            # The gate, before anything is published. `npm test` includes the
            # packed-contents check, which builds via `prepare` and compares the
            # tarball against every compiled module on disk — so a tarball that
            # would install a binary with no modules behind it fails HERE rather
            # than on a user's machine.
            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Pack
              id: pack
              run: |
                  file=$(npm pack --silent)
                  echo "file=$file" >> "$GITHUB_OUTPUT"
                  echo "Packed $file"
                  tar -tzf "$file" | head -40

            # Verify the ARTIFACT, not the green jobs above it. A release whose
            # asset is missing or empty is the failure this repository has
            # already shipped once.
            - name: The tarball exists and is not empty
              run: |
                  test -s "${{ steps.pack.outputs.file }}"
                  tar -tzf "${{ steps.pack.outputs.file }}" | grep -q '^package/dist/cli\.js$'

            - name: Publish the release with the tarball attached
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                    "${{ steps.pack.outputs.file }}" \
                    --title "${{ github.ref_name }}" \
                    --generate-notes
